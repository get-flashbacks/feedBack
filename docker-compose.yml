services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount your song library folder (adjust path for your system)
      - ${LIBRARY_PATH:-./library}:/dlc
      # Persistent config and cache
      - feedBack-config:/config
      # Mount source for live reload during development
      - ./static:/app/static
      - ./server.py:/app/server.py
      - ./VERSION:/app/VERSION
      - ./ug_browser.py:/app/ug_browser.py
      - ./lib:/app/lib
      - ./plugins:/app/plugins
      - ./.git:/app/.git:ro
      # Sibling plugin repos cloned alongside this repo under D:\Github.
      # Windows junctions inside ./plugins don't resolve through Docker
      # Desktop's WSL2 9p bridge (they translate to /mnt/host/... symlinks
      # that aren't mounted in the container), so these are bind-mounted
      # directly instead.
      - ../feedBack-plugin-fretboard:/app/plugins/fretboard
      - ../feedBack-plugin-metronome:/app/plugins/metronome
      - ../feedBack-plugin-piano:/app/plugins/piano
      - ../feedBack-plugin-sectionmap:/app/plugins/section_map
      - ../feedBack-plugin-splitscreen:/app/plugins/splitscreen
      - ../feedback-plugin-difficulty-ladder:/app/plugins/difficulty_ladder
      - ../feedBack-plugin-feedpakr:/app/plugins/feedpakr
    environment:
      - PYTHONPATH=/app/lib:/app
      - DLC_DIR=/dlc
      - CONFIG_DIR=/config
      # Write note_detect recordings to the host-visible bind mount (./static)
      # rather than the /config Docker volume: recorded takes (and training
      # bundles) then land in static/note_detect_recordings/ on the host, where
      # the offline harness can read them directly.
      - STATIC_DIR=/app/static
      # Logging (optional)
      # - LOG_LEVEL=DEBUG       # DEBUG | INFO | WARNING | ERROR  (default: INFO)
      # - LOG_FORMAT=json       # json | text  (default: text — coloured console)
      # - LOG_FILE=/config/feedBack.log  # also write to a persistent file
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  feedBack-config:
