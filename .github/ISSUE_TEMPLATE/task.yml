name: Task or improvement
description: Track cleanup, refactors, documentation, research, or non-bug work.
title: "[Task]: "
labels: ["task", "needs triage"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be accomplished?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included, and what is intentionally out of scope?
  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      description: Break the work into concrete steps.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - low
        - medium
        - high
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
